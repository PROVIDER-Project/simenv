[project]
name = "provider-simenv"
version = "0.1.0"
description = "A Simulation Environment for Supply Chain Security"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Melodie>=0.6.0",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.4",
    "tox-uv>=1.33.0",
    "tox>=4.47.0",
    "pytest>=8.0",
    "provider-simenv[db]",
]

db = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[tool.ruff]
line-length = 78

[tool.setuptools.packages.find]
where = ["src"]
